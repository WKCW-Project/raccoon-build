name: Build Raccoon Kernel

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'What to build'
        required: true
        default: 'both'
        type: choice
        options:
          - stock       # Stock kernel only, no BakaSU/SUSFS
          - ksu_susfs   # BakaSU + SUSFS only
          - both        # Stock first, then BakaSU+SUSFS on the same clone
      clang_choice:
        description: 'Clang toolchain'
        required: true
        default: '1'
        type: choice
        options:
          - '1'   # Zyc Clang 16.0.6
          - '2'   # Prelude Clang 16.0.2
      kernel_branch:
        description: 'Kernel branch to build'
        required: true
        default: 'raccoon'
      create_release:
        description: 'Publish result as a GitHub Release?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      release_tag:
        description: 'Release tag (required if create_release = yes, e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-raccoon-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # bash -eo pipefail

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERNEL_REPO: WKCW-Project/android_kernel_raccoon-66
      KERNEL_DEFCONFIG: raccoon_defconfig
      KBUILD_BUILD_USER: byben
      KBUILD_BUILD_HOST: wkcw
      SUSFS_BRANCH: gki-android15-6.6
      # Paths
      MAIN: ${{ github.workspace }}
      KERNEL_DIR: ${{ github.workspace }}/kernel
      CLANG_DIR: ${{ github.workspace }}/toolchains/clang
      # Inputs passed via env (avoids injecting free text into shell scripts)
      IN_VARIANT: ${{ inputs.build_variant }}
      IN_CLANG: ${{ inputs.clang_choice }}
      IN_RELEASE: ${{ inputs.create_release }}
      IN_TAG: ${{ inputs.release_tag }}

    steps:
      # ------------------------------------------------------------------ #
      # Preparation
      # ------------------------------------------------------------------ #
      - name: Validate inputs & resolve build flags
        id: flags
        run: |
          if [ "$IN_RELEASE" = "yes" ] && [ -z "$IN_TAG" ]; then
            echo "::error::release_tag is required when create_release = yes"
            exit 1
          fi

          case "$IN_VARIANT" in
            stock)     stock=true;  ksu=false ;;
            ksu_susfs) stock=false; ksu=true  ;;
            both)      stock=true;  ksu=true  ;;
            *) echo "::error::Unknown build_variant: $IN_VARIANT"; exit 1 ;;
          esac

          echo "stock=$stock" >> "$GITHUB_OUTPUT"
          echo "ksu=$ksu"     >> "$GITHUB_OUTPUT"

      - name: Clone kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ inputs.kernel_branch }}
          path: kernel
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc binutils bison build-essential cmake curl dwarves elfutils flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gzip libelf-dev \
            libncurses-dev libssl-dev lld llvm lz4 perl python3 python3-pip \
            rsync unzip wget xz-utils zip zstd clang

      - name: Create helper scripts
        run: |
          HELPERS="$RUNNER_TEMP/ci"
          echo "HELPERS=$HELPERS" >> "$GITHUB_ENV"
          mkdir -p "$HELPERS"

          # ---- build.sh <out-dir-name> ----
          cat > "$HELPERS/build.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          OUT_DIR="$KERNEL_DIR/$1"

          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          KBUILD_COMPILER_STRING="$(clang --version | head -n 1 \
            | perl -pe 's/\(http.*?\)//gs' \
            | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')"
          export KBUILD_COMPILER_STRING

          cd "$KERNEL_DIR"
          MAKE_ARGS=(
            O="$OUT_DIR" CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-w"
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER"
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST"
          )

          make "${MAKE_ARGS[@]}" "$KERNEL_DEFCONFIG"
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}"
          EOF

          # ---- package.sh <out-dir-name> <label> ----
          cat > "$HELPERS/package.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          OUT_DIR="$KERNEL_DIR/$1"
          LABEL="$2"
          BOOT_DIR="$OUT_DIR/arch/arm64/boot"
          TIME="$(date '+%Y%m%d-%H%M%S')"
          TMP_DIR="$KERNEL_DIR/anykernel_temp_$LABEL"
          ZIP_NAME="Raccoon-66-$LABEL-$TIME.zip"

          [ -d "$KERNEL_DIR/anykernel" ] || { echo "::error::anykernel directory not found!"; exit 1; }

          rm -rf "$TMP_DIR"
          cp -r "$KERNEL_DIR/anykernel" "$TMP_DIR"

          found=""
          for img in Image.gz-dtb Image.gz Image; do
            if [ -f "$BOOT_DIR/$img" ]; then
              cp -v "$BOOT_DIR/$img" "$TMP_DIR/"
              found="$img"
              break
            fi
          done
          [ -n "$found" ] || { echo "::error::No kernel image found in $BOOT_DIR"; exit 1; }

          (cd "$TMP_DIR" && zip -r9 "$KERNEL_DIR/$ZIP_NAME" ./*)
          rm -rf "$TMP_DIR"

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          EOF

          chmod +x "$HELPERS"/*.sh

      # ------------------------------------------------------------------ #
      # Toolchain
      # ------------------------------------------------------------------ #
      - name: Cache Clang toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-${{ inputs.clang_choice }}-v1

      - name: Download Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR"

          retry() {
            local n
            for n in 1 2 3 4 5; do
              "$@" && return 0
              echo "Attempt $n/5 failed, retrying in $((n * 20))s..."
              sleep $((n * 20))
            done
            return 1
          }

          if [ "$IN_CLANG" = "1" ]; then
            URL="https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20250721-release/Clang-16.0.6-20250721.tar.gz"
            retry wget -q -O "$MAIN/clang.tar.gz" "$URL"
            tar -xf "$MAIN/clang.tar.gz" -C "$CLANG_DIR"
            rm -f "$MAIN/clang.tar.gz"
          else
            rm -rf "$CLANG_DIR"
            retry git clone --depth=1 https://gitlab.com/jjpprrrr/prelude-clang.git "$CLANG_DIR"
          fi

      - name: Verify Clang
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          clang --version

      # ------------------------------------------------------------------ #
      # Stock build
      # ------------------------------------------------------------------ #
      - name: Build kernel (stock)
        if: steps.flags.outputs.stock == 'true'
        run: $HELPERS/build.sh out-stock

      - name: Package stock zip
        id: pack_stock
        if: steps.flags.outputs.stock == 'true'
        run: $HELPERS/package.sh out-stock Stock

      - name: Upload stock zip
        if: steps.flags.outputs.stock == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack_stock.outputs.zip_name }}
          path: kernel/${{ steps.pack_stock.outputs.zip_name }}
          retention-days: 7

      # ------------------------------------------------------------------ #
      # BakaSU + SUSFS build
      # ------------------------------------------------------------------ #
      - name: Setup BakaSU
        if: steps.flags.outputs.ksu == 'true'
        run: |
          cd "$KERNEL_DIR"
          [ -d common ] && cd common

          curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          echo "BakaSU setup complete"

      - name: Setup SUSFS
        if: steps.flags.outputs.ksu == 'true'
        run: |
          clone_with_retry() {
            local url="$1" branch="$2" dest="$3" n
            for n in 1 2 3 4 5; do
              if git clone --depth=1 "$url" -b "$branch" "$dest"; then
                return 0
              fi
              echo "Clone failed (attempt $n/5), retrying in $((n * 20))s..."
              rm -rf "$dest"
              sleep $((n * 20))
            done
            return 1
          }

          echo "=== Setting up SUSFS (branch: $SUSFS_BRANCH) ==="
          clone_with_retry https://gitlab.com/simonpunk/susfs4ksu.git \
            "$SUSFS_BRANCH" "$MAIN/susfs4ksu"

          cd "$KERNEL_DIR"
          [ -d common ] && cd common

          PATCH="50_add_susfs_in_${SUSFS_BRANCH}.patch"

          cp "$MAIN/susfs4ksu/kernel_patches/fs/"* fs/
          cp "$MAIN/susfs4ksu/kernel_patches/include/linux/"* include/linux/
          cp "$MAIN/susfs4ksu/kernel_patches/$PATCH" .
          patch -p1 --no-backup-if-mismatch < "$PATCH"

          echo "SUSFS setup complete"

      - name: Enable kernel configs
        if: steps.flags.outputs.ksu == 'true'
        run: |
          cd "$KERNEL_DIR"
          [ -d common ] && cd common

          DEFCONFIG="arch/arm64/configs/$KERNEL_DEFCONFIG"
          [ -f "$DEFCONFIG" ] || { echo "::error::$DEFCONFIG not found"; exit 1; }

          set_config() {
            sed -i -e "/^$1=/d" -e "/^# $1 is not set/d" "$DEFCONFIG"
            echo "$1=$2" >> "$DEFCONFIG"
          }

          # BakaSU (CONFIG_KSU) + symbol visibility
          set_config CONFIG_KSU y
          set_config CONFIG_KALLSYMS y
          set_config CONFIG_KALLSYMS_ALL y

          # SUSFS
          for opt in \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP
          do
            set_config "$opt" y
          done

          echo "Kernel configs enabled in $KERNEL_DEFCONFIG"

      - name: Build kernel (BakaSU+SUSFS)
        if: steps.flags.outputs.ksu == 'true'
        run: $HELPERS/build.sh out-ksu-susfs

      - name: Package BakaSU+SUSFS zip
        id: pack_ksu
        if: steps.flags.outputs.ksu == 'true'
        run: $HELPERS/package.sh out-ksu-susfs BakaSU-SUSFS

      - name: Upload BakaSU+SUSFS zip
        if: steps.flags.outputs.ksu == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack_ksu.outputs.zip_name }}
          path: kernel/${{ steps.pack_ksu.outputs.zip_name }}
          retention-days: 7

      # ------------------------------------------------------------------ #
      # Release
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        if: inputs.create_release == 'yes'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: kernel/Raccoon-66-*.zip
